# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/customer_service/webserver.pid;
error_log /var/log/sdkwork/customer_service/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:18091;
    }
    server {
        listen 80;
        server_name customer-service-test.sdkwork.com customer-service-test.birdcoder.com customer-service-test.dtupay.com customer-service-test.sdkwork.cn customer-service-test.birdcoder.cn customer-service-test.dtupay.cn customer-service-test.skubc.com customer-service-test.skubc.cn customer-service-test.zowalk.com customer-service-test.zowalk.cn customer-service-test.offer86.com customer-service-test.offer86.cn customer-service-test.86offer.com customer-service-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
