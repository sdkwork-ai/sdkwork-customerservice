# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/customer_service/webserver.pid;
error_log /var/log/sdkwork/customer_service/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name customer-service-dev.sdkwork.com customer-service-dev.birdcoder.com customer-service-dev.dtupay.com customer-service-dev.sdkwork.cn customer-service-dev.birdcoder.cn customer-service-dev.dtupay.cn customer-service-dev.skubc.com customer-service-dev.skubc.cn customer-service-dev.zowalk.com customer-service-dev.zowalk.cn customer-service-dev.offer86.com customer-service-dev.offer86.cn customer-service-dev.86offer.com customer-service-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
